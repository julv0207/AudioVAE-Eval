[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-vae-eval"
version = "0.1.0"
description = "Reproducible reconstruction evaluation for audio autoencoders"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.26",
  "numpy>=1.26",
  "pyyaml>=6",
  "scipy>=1.11",
  "soundfile>=0.12",
  "torch>=2.4",
  "torchaudio>=2.4",
  "torchmetrics>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
audio-vae-eval = "audio_vae_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_vae_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
